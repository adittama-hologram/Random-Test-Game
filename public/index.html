<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Pong - Random Game Test</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Name Input -->
        <div id="name-input-screen" class="screen active">
            <div class="glass-panel">
                <h1>GALACTIC PONG</h1>
                <p>Enter your pilot name to begin</p>
                <input type="text" id="player-name" placeholder="Pilot Name" maxlength="15">
                <button id="start-btn">ENGAGE</button>
            </div>
        </div>

        <!-- Timer & HUD -->
        <div id="hud" class="hidden">
            <div class="hud-top">
                <div class="score-display">
                    <span id="player-hud-score">0</span>
                    <span class="vs">VS</span>
                    <span id="cpu-hud-score">0</span>
                </div>
                <div id="timer">60s</div>
            </div>
            <div id="countdown" class="hidden"></div>
        </div>

        <!-- End Game Popup -->
        <div id="end-game-screen" class="screen hidden">
            <div class="glass-panel">
                <h2 id="result-text">MISSION COMPLETE</h2>
                <div class="final-scores">
                    <div class="score-item">
                        <span class="label">PLAYER</span>
                        <span id="final-player-score" class="value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">CPU</span>
                        <span id="final-cpu-score" class="value">0</span>
                    </div>
                </div>
                <div class="button-group">
                    <button id="retry-btn">RETRY</button>
                    <button id="leaderboard-btn">LEADERBOARD</button>
                </div>
            </div>
        </div>

        <!-- Leaderboard Popup -->
        <div id="leaderboard-screen" class="screen hidden">
            <div class="glass-panel">
                <h2>TOP PILOTS</h2>
                <div id="leaderboard-list">
                    <!-- Loaded via JS -->
                </div>
                <button id="back-to-menu-btn">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
        <button id="move-up" class="control-btn">▲</button>
        <button id="move-down" class="control-btn">▼</button>
    </div>

    <!-- Scripts -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="js/game.js"></script>
</body>
</html>
